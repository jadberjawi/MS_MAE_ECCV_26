# Unlabeled SPECT volumes for self-supervised pretraining.
name: ssl_unlabeled

# Source / cache
raw_dir: ${paths.project_root}/data/unlabeled/DICOM
cache_dir: ${paths.cache_dir}/unlabeled         # filled by scripts/prepare_data.py

# Preprocessing applied at prepare-time (NOT per epoch).
preprocess:
  target_spacing: [4.0, 4.0, 4.0]   # mm, isotropic resample
  target_shape: [64, 64, 64]        # final cube the network sees
  clip_percentiles: [0.5, 99.5]     # robust intensity clip before [0,1] norm
  # Label-free LV-centred cropping (src/data/smart_crop.py). Crop a fixed box on
  # the 4 mm grid around the detected LV, then pad (not resample) to target_shape.
  # MUST use the same crop_size/lv_radius/use_ring in seg.yaml for scale consistency.
  smart_crop: true
  crop_size: [48, 48, 48]           # box on the (4 mm) grid, padded into target_shape
  lv_radius: 9.0                    # approx LV mid-wall radius in voxels (ring guard)
  use_ring: true                    # ring guard against liver/intensity hijack

# Per-epoch loader settings
loader:
  batch_size: 4
  num_workers: 2
  pin_memory: false
  persistent_workers: false

# Train/val split for SSL (we do an unsupervised "val" via held-out reconstruction loss / pretext acc)
val_fraction: 0.1
seed: ${seed}

# SSL augmentation (TRAIN only; val is never augmented). See src/data/ssl_augment.py.
#   GEOMETRIC (rotation, translation) -> applied to BOTH the target and the input
#     identically (enriches pose; does NOT ask the model to undo pose).
#   APPEARANCE (intensity scale, Poisson noise) -> applied to the INPUT view ONLY;
#     the reconstruction target stays CLEAN, so the model learns to be INVARIANT to
#     the intensity/noise variation that differs across tracers and centers.
# Set enable:false to reproduce the no-augmentation pretraining behaviour.
augment:
  enable: false
  rotation_deg: 8.0
  p_rotation: 0.7
  translation_voxels: 3
  p_translation: 0.7
  intensity_scale: 0.10
  p_intensity: 0.5
  poisson_strength: 0.05
  p_noise: 0.5
